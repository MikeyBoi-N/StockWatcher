name: Build Market Data & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Every 4 hours on weekdays, aligned to US market hours: two in-session refreshes plus one after the close
    # (15:00 / 19:00 / 23:00 UTC = 11am / 3pm / 7pm EDT, 10am / 2pm / 6pm EST).
    - cron: "0 15,19,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://mikeyboi-n.github.io/StockWatcher/
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run Tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
          npm test

      - name: Fetch Previously Deployed Market Data
        # Alerts compare the new build against what the site currently shows. The copy lives outside the
        # repository so it isn't deployed.
        continue-on-error: true
        run: curl -fsSL "${SITE_URL}data/market.json" -o "$RUNNER_TEMP/previous-market.json"

      - name: Refresh US-Listed Symbol Directory
        # Falls back to the committed data/symbols.json if Nasdaq Trader is unreachable.
        continue-on-error: true
        run: python scripts/fetch_symbols.py

      - name: Build Market Data
        # The script refuses to overwrite data/market.json unless SPY, QQQ and 80% of the core universe succeed;
        # on failure the committed snapshot is deployed and the page shows how old it is.
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/build_market_data.py

      - name: Validate Market Data With Scoring Engine
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Install Firebase Admin Dependencies
        # Installed after the Pages upload so node_modules is never published with the site.
        run: npm ci --no-audit --no-fund

      - name: Deploy Firestore Rules
        # Before the site deploy, so pages that write new profile fields never meet the old rules.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy_firestore_rules.mjs

      - name: Record Daily History
        # Stores this build as its own Firestore snapshot, which the Historical view reads back. Runs after the rules
        # deploy so a new snapshot is readable as soon as it lands, and never fails the build. Snapshots live in
        # Firestore, so deploys never touch them.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/record_history.mjs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Email Alerts
        # Runs after deploy so email links show the data that triggered them; skips itself until the secrets exist.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/send_alerts.mjs "$RUNNER_TEMP/previous-market.json"
