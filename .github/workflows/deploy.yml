name: Build Market Data & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Every 4 hours on weekdays, aligned to US market hours: two in-session refreshes plus one after the close
    # (15:00 / 19:00 / 23:00 UTC = 11am / 3pm / 7pm EDT, 10am / 2pm / 6pm EST).
    - cron: "0 15,19,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
          node --test tests/engine.test.mjs

      - name: Refresh US-Listed Symbol Directory
        # Falls back to the committed data/symbols.json if Nasdaq Trader is unreachable.
        continue-on-error: true
        run: python scripts/fetch_symbols.py

      - name: Build Market Data
        # The script refuses to overwrite data/market.json unless SPY, QQQ and 80% of the core universe succeed;
        # on failure the committed snapshot is deployed and the page shows how old it is.
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/build_market_data.py

      - name: Validate Market Data With Scoring Engine
        run: node --test tests/engine.test.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
