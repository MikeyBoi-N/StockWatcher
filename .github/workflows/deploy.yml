name: Build Market Data & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Every 4 hours on weekdays, aligned to US market hours: two in-session refreshes plus one after the close
    # (15:00 / 19:00 / 23:00 UTC = 11am / 3pm / 7pm EDT, 10am / 2pm / 6pm EST).
    - cron: "0 15,19,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two jobs so a stuck Pages deploy can't stop the data. On 2026-10-06 one run hung in "waiting" on the github-pages
# environment and, sharing a single concurrency group, held back every later run for nine days: no data, no history,
# no alerts. Now only the deploy job touches the environment, and each job has its own queue.
jobs:
  build:
    runs-on: ubuntu-latest
    # Builds take about 3 minutes, plus about 5 for the weekly screen; a hung step is killed instead of blocking the queue.
    timeout-minutes: 40
    # One build at a time, never cancelled midway: each one records history and sends alerts.
    concurrency:
      group: data-build
      cancel-in-progress: false
    env:
      SITE_URL: https://mikeyboi-n.github.io/StockWatcher/
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run Tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
          npm test

      - name: Fetch Previously Deployed Market Data
        # Alerts compare the new build against what the site currently shows. The copy lives outside the
        # repository so it isn't deployed.
        # The earnings history saves paging back through years of EDGAR filings every build (see build_market_data.py).
        continue-on-error: true
        run: |
          curl -fsSL "${SITE_URL}data/market.json" -o "$RUNNER_TEMP/previous-market.json" || echo "no previous market.json"
          curl -fsSL "${SITE_URL}data/earnings.json" -o "$RUNNER_TEMP/previous-earnings.json" || echo "no previous earnings.json"
          curl -fsSL "${SITE_URL}data/screen.json" -o "$RUNNER_TEMP/previous-screen.json" || echo "no previous screen.json"

      - name: Refresh US-Listed Symbol Directory
        # Falls back to the committed data/symbols.json if Nasdaq Trader is unreachable.
        continue-on-error: true
        run: python scripts/fetch_symbols.py

      - name: Weekly Universe Screen
        # Screens about 1,500 US stocks outside the app's list and keeps 50 picks for the build below. Reuses the
        # deployed screen while it is under 6 days old, so it only fetches once a week; each new screen carries the
        # earlier picks forward and scores them against SPY. On failure the build uses the previous picks (or none).
        continue-on-error: true
        run: python scripts/screen_universe.py --previous "$RUNNER_TEMP/previous-screen.json"

      - name: Build Market Data
        # The script refuses to overwrite data/market.json unless SPY, QQQ and 80% of the core universe succeed;
        # on failure the committed snapshot is deployed and the page shows how old it is.
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python scripts/build_market_data.py --previous-earnings "$RUNNER_TEMP/previous-earnings.json"

      - name: Forecast Volatility
        # Adds a GJR-GARCH forecast to each stock in data/market.json from the five years of candles in data/replay.json.
        # Options are priced against it; without it (a failed build, or a fit that errors) the engine falls back to
        # 30-day realized volatility, so a failure here never stops the build.
        continue-on-error: true
        run: node scripts/forecast_vol.mjs

      - name: Validate Market Data With Scoring Engine
        run: npm test

      - name: Build Developer API And Page Snapshot
        # Writes api/v1/ from the same data/market.json and engine as the page, before the Pages upload publishes it.
        # --page also writes a static copy of the readings into index.html for clients that don't run JavaScript.
        run: node scripts/build_api.mjs --page

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        # The deploy job publishes this artifact.
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Install Firebase Admin Dependencies
        # Installed after the Pages upload so node_modules is never published with the site.
        run: npm ci --no-audit --no-fund

      - name: Deploy Firestore Rules
        # Before the site deploy, so pages that write new profile fields never meet the old rules.
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deploy_firestore_rules.mjs

      - name: Record Daily History
        # Stores this build as its own Firestore snapshot, which the Historical view reads back. Runs after the rules
        # deploy so a new snapshot is readable as soon as it lands, and never fails the build. Snapshots live in
        # Firestore, so deploys never touch them.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/record_history.mjs

      - name: Send Email Alerts
        # Sent from the build rather than after the deploy so a stuck deploy can't hold them back; the site normally
        # shows the new data a minute or two later. A mail failure is marked on the step but doesn't block the deploy.
        # Skips itself until the secrets exist.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/send_alerts.mjs "$RUNNER_TEMP/previous-market.json"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the newest build matters on the site, so a newer deploy replaces an older one, including one stuck waiting.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
